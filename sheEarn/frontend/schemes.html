<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Government Schemes – SheEarn</title>
  <meta name="description" content="Discover government schemes and financial support programs for women entrepreneurs.">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .schemes-hero {
      background: linear-gradient(135deg, var(--bg-surface), #1a0a2e);
      padding: 60px 24px; text-align: center; border-bottom: 1px solid var(--border);
    }
    .scheme-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px; transition: var(--transition); cursor: pointer;
    }
    .scheme-card:hover { border-color: var(--border-strong); transform: translateY(-4px); box-shadow: var(--glow); }
    .scheme-cat-icon { font-size: 2rem; margin-bottom: 12px; }
    .scheme-cat-badge { margin-bottom: 12px; }
    .scheme-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; }
    .scheme-snippet { font-size: .85rem; line-height: 1.6; }
    .step-list { list-style: none; display: flex; flex-direction: column; gap: 8px; padding: 0; }
    .step-list li { display: flex; gap: 10px; font-size: .88rem; }
    .step-num-sm { min-width: 22px; height: 22px; border-radius: 50%; background: var(--grad-primary); color: #fff; font-size: .75rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .cat-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .cat-pill {
      padding: 7px 16px; border-radius: 99px; font-size: .85rem; font-weight: 600;
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-secondary); cursor: pointer; transition: var(--transition);
    }
    .cat-pill.active { background: var(--grad-primary); color: #fff; border-color: transparent; }
  </style>
</head>
<body>
  <header class="navbar" id="navbar"></header>
  <div class="page-content">

    <!-- Hero -->
    <div class="schemes-hero">
      <h1>Government <span class="gradient-text">Schemes</span> for Women</h1>
      <p style="max-width:560px;margin:12px auto 0">Access financial aid, skill training, loans, and health benefits designed specifically for women entrepreneurs.</p>
    </div>

    <div style="max-width:1100px;margin:0 auto;padding:40px 24px">
      <!-- Category Filter -->
      <div class="cat-tabs mb-lg" id="cat-tabs">
        <div class="cat-pill active" data-cat="" onclick="selectSchemeCat(this,'')">🌟 All</div>
        <div class="cat-pill" data-cat="financial_inclusion" onclick="selectSchemeCat(this,'financial_inclusion')">💰 Financial</div>
        <div class="cat-pill" data-cat="entrepreneurship" onclick="selectSchemeCat(this,'entrepreneurship')">🚀 Entrepreneurship</div>
        <div class="cat-pill" data-cat="health_maternity" onclick="selectSchemeCat(this,'health_maternity')">❤️ Health</div>
        <div class="cat-pill" data-cat="safety_education" onclick="selectSchemeCat(this,'safety_education')">🛡️ Safety & Education</div>
      </div>

      <div class="grid-3" id="schemes-grid">
        <div class="flex-center" style="grid-column:1/-1;padding:60px"><div class="loader"></div></div>
      </div>
    </div>
  </div>

  <!-- Scheme Detail Modal -->
  <div class="modal-overlay" id="scheme-modal">
    <div class="modal" style="max-width:600px">
      <div class="modal-header">
        <div class="modal-title" id="modal-scheme-title"></div>
        <button class="modal-close" onclick="closeModal('scheme-modal')">✕</button>
      </div>
      <div id="modal-scheme-body"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!Auth.requireAuth()) throw '';
    buildNavbar('schemes');

    const CAT_ICONS = { financial_inclusion: '💰', entrepreneurship: '🚀', health_maternity: '❤️', safety_education: '🛡️' };
    const CAT_LABELS = { financial_inclusion: 'Financial', entrepreneurship: 'Entrepreneurship', health_maternity: 'Health & Maternity', safety_education: 'Safety & Education' };
    const CAT_BADGE_CLASS = { financial_inclusion: 'badge-success', entrepreneurship: 'badge-primary', health_maternity: 'badge-accent', safety_education: 'badge-info' };

    let allSchemes = [];

    function selectSchemeCat(el, cat) {
      document.querySelectorAll('.cat-pill').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
      renderSchemes(cat ? allSchemes.filter(s => s.category === cat) : allSchemes);
    }

    async function loadSchemes() {
      try {
        const res = await api.listSchemes({ per_page: 50 });
        allSchemes = res.data.items;
        renderSchemes(allSchemes);
      } catch(err) {
        document.getElementById('schemes-grid').innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">⚠️</div><h3>${err.message}</h3></div>`;
      }
    }

    function renderSchemes(schemes) {
      const el = document.getElementById('schemes-grid');
      if (!schemes.length) {
        el.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🏛️</div><h3>No schemes found</h3></div>`;
        return;
      }
      el.innerHTML = schemes.map(s => `
        <div class="scheme-card" onclick="showScheme(${s.id})">
          <div class="scheme-cat-icon">${CAT_ICONS[s.category] || '🏛️'}</div>
          <div class="scheme-cat-badge"><span class="badge ${CAT_BADGE_CLASS[s.category] || 'badge-muted'}">${CAT_LABELS[s.category] || s.category}</span></div>
          <div class="scheme-title">${s.name}</div>
          <p class="scheme-snippet">${(s.eligibility || s.benefits || '').slice(0, 120)}${(s.eligibility || '').length > 120 ? '…' : ''}</p>
          <div class="mt-sm">
            <span style="font-size:.8rem;color:var(--primary);font-weight:600">View Details →</span>
          </div>
        </div>`).join('');
    }

    async function showScheme(id) {
      openModal('scheme-modal');
      document.getElementById('modal-scheme-body').innerHTML = '<div class="flex-center" style="padding:40px"><div class="loader"></div></div>';
      try {
        const res = await api.getScheme(id);
        const s = res.data;
        document.getElementById('modal-scheme-title').textContent = s.name;

        const steps = s.application_steps?.length
          ? `<ul class="step-list">${s.application_steps.map((st,i) => `<li><div class="step-num-sm">${i+1}</div><span>${st}</span></li>`).join('')}</ul>`
          : '<p class="text-muted">Not specified</p>';

        document.getElementById('modal-scheme-body').innerHTML = `
          <div style="display:flex;flex-direction:column;gap:20px">
            <div>
              <div style="font-size:.8rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Eligibility</div>
              <p>${s.eligibility || 'Not specified'}</p>
            </div>
            <div>
              <div style="font-size:.8rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Benefits</div>
              <p style="color:var(--success);font-weight:600">${s.benefits || 'Not specified'}</p>
            </div>
            <div>
              <div style="font-size:.8rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">How to Apply</div>
              ${steps}
            </div>
            ${s.scheme_url ? `<a href="${s.scheme_url}" target="_blank" class="btn btn-primary">🌐 Apply on Official Website</a>` : ''}
          </div>`;
      } catch(err) {
        document.getElementById('modal-scheme-body').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    closeModalOnOverlay('scheme-modal');
    loadSchemes();
  </script>
</body>
</html>
